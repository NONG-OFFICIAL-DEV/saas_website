name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# =========================
# 1. Build & Push Docker Images
# =========================
jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/saas-website-backend
      IMAGE_WEBSERVER: ${{ secrets.DOCKERHUB_USERNAME }}/saas-website-webserver
      IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-website
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push backend
        run: |
          docker build \
            -t $IMAGE_BACKEND:latest \
            -t $IMAGE_BACKEND:$IMAGE_TAG \
            ./backend

          docker push $IMAGE_BACKEND:latest
          docker push $IMAGE_BACKEND:$IMAGE_TAG

      - name: Build & Push webserver (nginx)
        run: |
          docker build \
            -t $IMAGE_WEBSERVER:latest \
            -t $IMAGE_WEBSERVER:$IMAGE_TAG \
            ./backend/nginx

          docker push $IMAGE_WEBSERVER:latest
          docker push $IMAGE_WEBSERVER:$IMAGE_TAG

      # Nuxt reads its API URLs etc. from runtime config (NUXT_PUBLIC_* env
      # vars, see frontend_nuxt/.env.example) instead of Vite build-time
      # args — the same image now works across environments, so no
      # --build-arg values are needed here. The server's docker-compose.yml
      # supplies them via env_file: ./frontend_nuxt/.env.
      - name: Build & Push frontend
        run: |
          docker build \
            -t $IMAGE_FRONTEND:latest \
            -t $IMAGE_FRONTEND:$IMAGE_TAG \
            ./frontend_nuxt

          docker push $IMAGE_FRONTEND:latest
          docker push $IMAGE_FRONTEND:$IMAGE_TAG

# =========================
# 2. Deploy to server
# =========================
  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 1: Copy the docker-compose file to the server
      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/nexstack-website"

      # STEP 2: Run the deployment script
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/nexstack-website

            echo ">>> Pulling latest images"
            docker compose pull

            echo ">>> Stopping old containers"
            docker compose down --remove-orphans

            echo ">>> Starting containers"
            docker compose up -d --remove-orphans

            echo ">>> Waiting for backend to come up"
            sleep 10

            echo ">>> Running migrations"
            docker exec saas_website_backend php artisan migrate --force

            echo ">>> Optimizing"
            docker exec saas_website_backend php artisan optimize

            echo ">>> Pruning unused Docker images"
            docker image prune -a --force
