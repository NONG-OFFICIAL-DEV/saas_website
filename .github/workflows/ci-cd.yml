name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
# =========================
# 1. Detect what changed
# =========================
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

# =========================
# 2. Build & Push Docker Images
# =========================
  build-push:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    env:
      IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/saas-website-backend
      IMAGE_WEBSERVER: ${{ secrets.DOCKERHUB_USERNAME }}/saas-website-webserver
      IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/smart-store-website
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker build \
            -t $IMAGE_BACKEND:latest \
            -t $IMAGE_BACKEND:$IMAGE_TAG \
            ./backend

          docker push $IMAGE_BACKEND:latest
          docker push $IMAGE_BACKEND:$IMAGE_TAG

      - name: Build & Push webserver (nginx)
        if: needs.changes.outputs.backend == 'true'
        run: |
          docker build \
            -t $IMAGE_WEBSERVER:latest \
            -t $IMAGE_WEBSERVER:$IMAGE_TAG \
            ./backend/nginx

          docker push $IMAGE_WEBSERVER:latest
          docker push $IMAGE_WEBSERVER:$IMAGE_TAG

      # Nuxt reads its API URLs etc. from runtime config (NUXT_PUBLIC_* env
      # vars, see frontend/.env.example) instead of Vite build-time args —
      # the same image now works across environments, so no --build-arg
      # values are needed here. The server's docker-compose.yml supplies
      # them via env_file: ./frontend/.env.
      - name: Build & Push frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          docker build \
            -t $IMAGE_FRONTEND:latest \
            -t $IMAGE_FRONTEND:$IMAGE_TAG \
            ./frontend

          docker push $IMAGE_FRONTEND:latest
          docker push $IMAGE_FRONTEND:$IMAGE_TAG

# =========================
# 3. Deploy to server
# =========================
  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    # build-push itself is skipped entirely when neither backend/ nor
    # frontend/ changed (e.g. a docs-only commit) — deploy has nothing to
    # do in that case either, so skip it the same way rather than running
    # a pointless restart of already-up-to-date containers.
    if: needs.build-push.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 1: Copy the docker-compose file to the server
      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/nexstack-website"

      # STEP 2: Run the deployment script
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/nexstack-website

            echo ">>> Pulling latest images"
            docker compose pull

            echo ">>> Stopping old containers"
            docker compose down --remove-orphans

            echo ">>> Starting containers"
            docker compose up -d --remove-orphans

            echo ">>> Waiting for backend to come up"
            sleep 10

            echo ">>> Running migrations"
            docker exec saas_website_backend php artisan migrate --force

            echo ">>> Optimizing"
            docker exec saas_website_backend php artisan optimize

            echo ">>> Pruning unused Docker images"
            docker image prune -a --force
